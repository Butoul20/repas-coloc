<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Popote">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<title>Popote de la coloc</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="haut">
  <div class="marque">🍲 Popote</div>
  <button id="moi" class="moi" aria-label="Changer de prénom"></button>
</header>
<div id="bandeau" class="bandeau" hidden></div>
<main id="vue"></main>
<nav class="onglets" aria-label="Navigation">
  <button data-onglet="recettes"><span>📖</span>Recettes</button>
  <button data-onglet="semaine"><span>📅</span>Semaine<b id="nb-semaine" class="pastille" hidden></b></button>
  <button data-onglet="courses"><span>🛒</span>Courses</button>
</nav>
<dialog id="fenetre"></dialog>
<script src="app.js"></script>
</body>
</html>
